version: '3.9'

services:
  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: speaklar-redis
    ports:
      - "127.0.0.1:6379:6379"   # bind to localhost only (not public)
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --loglevel warning
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - speaklar-net
    restart: unless-stopped

  # ── FastAPI RAG Service ───────────────────────────────────────────────────────
  api:
    image: ${API_IMAGE:-speaklar-rag:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speaklar-api
    ports:
      - "8000:8000"
    env_file:
      - .env                          # ← GROQ_API_KEY, OPENAI_API_KEY etc.
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data              # ← mounts pre-built indexes, avoids rebuild
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - speaklar-net
    restart: unless-stopped

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: speaklar-prometheus
    ports:
      - "127.0.0.1:9090:9090"   # internal only
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    depends_on:
      - api
    networks:
      - speaklar-net
    restart: unless-stopped

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.0
    container_name: speaklar-grafana
    ports:
      - "127.0.0.1:3000:3000"   # internal only — access via SSH tunnel or nginx
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - speaklar-net
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  speaklar-net:
    driver: bridge
